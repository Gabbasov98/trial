<div class="modal" id="reqModal">
    <div class="modal__bg modal-bg _close-modal"></div>
    <button class="close-btn _close-modal">
        <img src="img/close2.svg" alt="">
    </button>
    <div class="modal__dialog">
        <div class="modal__top">
            <div class="h2 caps-text-tablet">
                Получить
                предложение
            </div>
            <div class="modal__desc _mt16 _mt8-tablet">
                <div class="text14 lh155">
                    Оставьте заявку, и наше менеджер свяжется с вами
                    для подтверждения записи на удобное время.
                </div>
            </div>
        </div>
        <div class="_mt32 _mt20-tablet">
            <form action="" class="service-form">
                <div class="service-form__grid">
                    <div class="fg _full">
                        <input type="text" placeholder="Ваше имя">
                    </div>
                    <div class="fg _full">
                        <input type="tel" placeholder="Ваш номер телефона">
                    </div>
                    <button class="service-form__btn m-btn m-btn-orange _full">
                        <span>Отправить</span>
                        <img src="img/arrow-right.svg" alt="">
                    </button>
                </div>
                <div class="m-check">
                    <input type="checkbox">
                    <label>
                    <span class="text14 lh155 white-text60">
                        Подтверждаю согласие с политикой конфиденциальности
                    </span>
                    </label>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal thank-modal" id="thankModal">
    <div class="modal__bg modal-bg _close-modal"></div>
    <button class="close-btn _close-modal">
        <img src="img/close2.svg" alt="">
    </button>
    <div class="modal__dialog">
        <div class="modal__top">
            <img src="img/check2.svg" alt="">
            <div class="h2 caps-text-tablet">
                Вы успешно записались!
            </div>
            <div class="_mt24 _mt16-tablet">
                <div class="text20 text14-tablet lh155">
                    Спасибо за заявку! Наш менеджер свяжется с вами
                    <span class="_no-wrap">в ближайшее время,</span> чтобы подтвердить запись.
                </div>
            </div>
        </div>
    </div>
</div>
