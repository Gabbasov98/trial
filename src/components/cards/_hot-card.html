<div class="hot-card">
    <div class="hot-card__img m-backdrop">

    </div>
    <div class="hot-card__badge @@badgeClass">
        <span class="text10">@@badge</span>

    <div class="hot-card__bottom">
        <div class="text20 text16-tablet semi-bold-text lh120">
            @@title
        </div>
    </div>
</div>
